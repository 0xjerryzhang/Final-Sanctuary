name: iOS Cloud Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'App Bundle ID (需与 App Store Connect 中一致)'
        required: false
        default: 'com.finalsanctuary.poker'
      upload_to_testflight:
        description: '打包完成后自动上传至 TestFlight'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: 'ios-testflight'
  cancel-in-progress: true

jobs:
  build-and-upload-ios:
    name: Build Signed IPA & Upload to TestFlight (macOS Xcode Cloud Runner)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Select Latest Xcode on Runner
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Install Node Dependencies
        run: npm ci || npm install

      - name: 5. Build Frontend Assets
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://ais-pre-zft2t4jfqfkvdl4edaqt36-161719948567.asia-southeast1.run.app' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || secrets.VITE_WS_URL || 'wss://ais-pre-zft2t4jfqfkvdl4edaqt36-161719948567.asia-southeast1.run.app/ws' }}
        run: npm run build:web

      - name: 6. Sync Web Assets into Capacitor iOS Project
        run: npx cap sync ios

      - name: 7. Update Bundle ID & Auto-Increment Build Number
        env:
          TARGET_BUNDLE_ID: ${{ github.event.inputs.bundle_id || secrets.IOS_BUNDLE_ID || 'com.finalsanctuary.poker' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Setting Bundle ID to: $TARGET_BUNDLE_ID"
          echo "Setting Build Number (CFBundleVersion) to: $BUILD_NUMBER"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${TARGET_BUNDLE_ID};/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj

      - name: 8. Validate App Store Connect Secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::缺少 App Store Connect API 密钥！请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加 ASC_ISSUER_ID、ASC_KEY_ID 和 ASC_PRIVATE_KEY。"
            exit 1
          fi

      - name: 9. Install Cloud Signing & Publishing Tools
        run: |
          python3 -m venv /tmp/cm-venv
          echo "/tmp/cm-venv/bin" >> $GITHUB_PATH
          /tmp/cm-venv/bin/pip install --upgrade pip
          /tmp/cm-venv/bin/pip install codemagic-cli-tools pycryptodome
          gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document

      - name: 10. Auto-Fetch / Create Signing Certificates & Provisioning Profile (Zero-Mac)
        env:
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || secrets.IOS_BUNDLE_ID || 'com.finalsanctuary.poker' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CUSTOM_CERT_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          # Initialize temporary signing keychain on GitHub Actions runner
          keychain initialize

          # Generate a deterministic 2048-bit RSA key from ASC_PRIVATE_KEY if CERTIFICATE_PRIVATE_KEY is not manually provided.
          # This guarantees the exact same RSA key across all workflow runs without needing a Mac or extra secrets.
          python3 - << 'EOF'
          import os, hashlib, hmac
          from Crypto.PublicKey import RSA

          custom_key = os.environ.get("CUSTOM_CERT_KEY", "").strip()
          if custom_key:
              with open("/tmp/cert_key.pem", "w") as f:
                  f.write(custom_key + "\n")
              print("Using provided CERTIFICATE_PRIVATE_KEY secret.")
          else:
              seed = os.environ["ASC_PRIVATE_KEY"].strip().encode("utf-8")
              counter = 0
              buf = b""
              def det_rand(n):
                  global counter, buf
                  while len(buf) < n:
                      counter += 1
                      buf += hmac.new(seed, counter.to_bytes(8, "big"), hashlib.sha256).digest()
                  out, buf = buf[:n], buf[n:]
                  return out
              key = RSA.generate(2048, randfunc=det_rand)
              with open("/tmp/cert_key.pem", "w") as f:
                  f.write(key.export_key("PEM").decode("utf-8") + "\n")
              print("Generated deterministic 2048-bit RSA signing key from ASC_PRIVATE_KEY.")
          EOF

          # Normalize .p8 private key formatting
          python3 - << 'EOF'
          import os
          raw = os.environ["ASC_PRIVATE_KEY"].strip()
          with open("/tmp/AuthKey.p8", "w") as f:
              f.write(raw + "\n")
          EOF

          # Fetch or automatically create Apple Distribution Certificate & App Store Provisioning Profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "@file:/tmp/AuthKey.p8" \
            --certificate-key "@file:/tmp/cert_key.pem" \
            --type IOS_APP_STORE \
            --create

          # Add certificates to signing keychain and apply profile to Xcode project
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: 11. Archive & Export Signed IPA
        run: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

      - name: 12. Upload Signed IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinalSanctuary-iOS-IPA-Build-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: 13. Publish IPA to App Store Connect (TestFlight)
        if: ${{ github.event.inputs.upload_to_testflight != 'false' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "@file:/tmp/AuthKey.p8"
